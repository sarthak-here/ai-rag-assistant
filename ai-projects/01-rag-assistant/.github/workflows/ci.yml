name: CI

on:
  push:
    paths:
      - 'ai-projects/01-rag-assistant/**'
  pull_request:
    paths:
      - 'ai-projects/01-rag-assistant/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-projects/01-rag-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
